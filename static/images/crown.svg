<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160" width="100%" height="100%">
  <defs>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="35%" stop-color="#F5DA76"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="90%" stop-color="#AA781C"/>
      <stop offset="100%" stop-color="#E5C76B"/>
    </linearGradient>
    <linearGradient id="crownLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF7D6"/>
      <stop offset="60%" stop-color="#E4C158"/>
      <stop offset="100%" stop-color="#9C7228"/>
    </linearGradient>
  </defs>
  <g transform="translate(0, 10)">
    <!-- Base Arch -->
    <path d="M 30,130 Q 150,145 270,130 Q 150,158 30,130 Z" fill="url(#crownGrad)"/>
    <path d="M 35,120 Q 150,135 265,120 L 268,126 Q 150,142 32,126 Z" fill="url(#crownLight)"/>
    
    <!-- Crown Body -->
    <path d="M 35,120 L 30,55 L 75,98 L 95,28 L 150,0 L 205,28 L 225,98 L 270,55 L 265,120 Q 150,135 35,120 Z" fill="url(#crownGrad)"/>

    <!-- Spheres on Tips -->
    <circle cx="30" cy="55" r="6" fill="url(#crownLight)"/>
    <circle cx="95" cy="28" r="7.5" fill="url(#crownLight)"/>
    <circle cx="150" cy="0" r="9.5" fill="url(#crownLight)"/>
    <circle cx="205" cy="28" r="7.5" fill="url(#crownLight)"/>
    <circle cx="270" cy="55" r="6" fill="url(#crownLight)"/>
  </g>
</svg>
