<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>

    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="25%" stop-color="#F5DA76"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#AA781C"/>
      <stop offset="100%" stop-color="#E5C76B"/>
    </linearGradient>

    <linearGradient id="favGoldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="50%" stop-color="#F5DA76"/>
      <stop offset="100%" stop-color="#C59D4E"/>
    </linearGradient>

    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#AA781C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background rounded plate -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#favBg)" stroke="url(#favBorder)" stroke-width="3"/>

  <!-- Crown Icon Centered -->
  <g transform="translate(19, 36) scale(0.3)">
    <!-- Base Arch -->
    <path d="M 30,130 Q 150,145 270,130 Q 150,162 30,130 Z" fill="url(#favGold)"/>
    <path d="M 35,120 Q 150,135 265,120 L 268,126 Q 150,142 32,126 Z" fill="url(#favGoldLight)"/>
    
    <!-- Crown Body -->
    <path d="M 35,120 L 30,55 L 75,98 L 95,28 L 150,0 L 205,28 L 225,98 L 270,55 L 265,120 Q 150,135 35,120 Z" fill="url(#favGold)"/>

    <!-- Spheres on Tips -->
    <circle cx="30" cy="55" r="9" fill="url(#favGoldLight)"/>
    <circle cx="95" cy="28" r="11" fill="url(#favGoldLight)"/>
    <circle cx="150" cy="0" r="14" fill="url(#favGoldLight)"/>
    <circle cx="205" cy="28" r="11" fill="url(#favGoldLight)"/>
    <circle cx="270" cy="55" r="9" fill="url(#favGoldLight)"/>
  </g>
</svg>
