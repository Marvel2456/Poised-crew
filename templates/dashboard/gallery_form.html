{% extends 'dashboard/base_dashboard.html' %}
{% load static %}

{% block header_title %}Add Photo to Gallery{% endblock %}

{% block content %}

<div class="max-w-2xl space-y-6">
  
  <a href="{% url 'agency:gallery_admin_list' %}" class="inline-flex items-center gap-1.5 text-xs text-slate-400 hover:text-gold-highlight transition-colors">
    <i data-lucide="arrow-left" class="w-4 h-4"></i>
    <span>Back to Gallery</span>
  </a>

  <form method="POST" class="glass-panel rounded-3xl p-6 sm:p-8 border border-gold-primary/30 shadow-2xl space-y-5">
    {% csrf_token %}

    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Photo Title <span class="text-gold-primary">*</span></label>
      <input type="text" name="title" required placeholder="e.g. VIP High Table Protocol Escort"
             class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Category</label>
      <select name="category" class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">
        {% for code, label in categories %}
        <option value="{{ code }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Image URL <span class="text-gold-primary">*</span></label>
      <input type="url" name="image_url" required placeholder="https://images.unsplash.com/..."
             class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm font-mono">
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Caption (Optional)</label>
      <input type="text" name="caption" placeholder="Short description of the moment..."
             class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">
    </div>

    <div class="pt-4 border-t border-gold-primary/20 flex items-center justify-between">
      <a href="{% url 'agency:gallery_admin_list' %}" class="px-5 py-2.5 rounded-xl bg-surface text-slate-400 hover:text-white text-xs">Cancel</a>
      <button type="submit" class="px-8 py-3 rounded-full bg-gradient-to-r from-gold-highlight via-gold-primary to-gold-bronze text-black font-bold text-xs shadow-xl hover:scale-105 transition-all">
        Add to Gallery
      </button>
    </div>

  </form>

</div>

{% endblock %}
