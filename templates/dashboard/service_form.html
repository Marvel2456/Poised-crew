{% extends 'dashboard/base_dashboard.html' %}
{% load static %}

{% block header_title %}{% if service %}Edit Service: {{ service.title }}{% else %}Add New Service{% endif %}{% endblock %}

{% block content %}

<div class="max-w-4xl space-y-6">
  
  <a href="{% url 'agency:services_admin_list' %}" class="inline-flex items-center gap-1.5 text-xs text-slate-400 hover:text-gold-highlight transition-colors">
    <i data-lucide="arrow-left" class="w-4 h-4"></i>
    <span>Back to Services List</span>
  </a>

  <form method="POST" class="glass-panel rounded-3xl p-6 sm:p-10 border border-gold-primary/30 shadow-2xl space-y-6">
    {% csrf_token %}

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Service Title <span class="text-gold-primary">*</span></label>
        <input type="text" name="title" value="{{ service.title|default:'' }}" required placeholder="e.g. VIP Protocol & Dignitary Liaison"
               class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Category</label>
        <select name="category" class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">
          {% for code, label in categories %}
          <option value="{{ code }}" {% if service.category == code %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Lucide Icon Name</label>
        <input type="text" name="icon_name" value="{{ service.icon_name|default:'crown' }}" placeholder="crown, users, award, mic, shield-check..."
               class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm font-mono">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Badge Text (Optional)</label>
        <input type="text" name="badge_text" value="{{ service.badge_text|default:'' }}" placeholder="e.g. Most Requested, VIP Exclusive"
               class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">
      </div>

      <div class="sm:col-span-2">
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Short Description (Teaser) <span class="text-gold-primary">*</span></label>
        <textarea name="short_description" rows="2" required placeholder="Short summary displayed on cards..."
                  class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">{{ service.short_description|default:'' }}</textarea>
      </div>

      <div class="sm:col-span-2">
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Full Description <span class="text-gold-primary">*</span></label>
        <textarea name="full_description" rows="4" required placeholder="Comprehensive breakdown of service methodology..."
                  class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">{{ service.full_description|default:'' }}</textarea>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Scope Deliverables (1 per line)</label>
        <textarea name="deliverables" rows="5" placeholder="Item 1&#10;Item 2&#10;Item 3"
                  class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-xs font-mono">{{ service.deliverables|default:'' }}</textarea>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Suitable Event Types (1 per line)</label>
        <textarea name="suitable_events" rows="5" placeholder="Corporate Summits&#10;Luxury Weddings&#10;Diplomatic Banquets"
                  class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-xs font-mono">{{ service.suitable_events|default:'' }}</textarea>
      </div>

      <div class="sm:col-span-2">
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Uniform &amp; Attire Guidance</label>
        <input type="text" name="uniform_recommendations" value="{{ service.uniform_recommendations|default:'Corporate Black-Tie or Luxury Velvet' }}"
               class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">
      </div>

      <div class="flex items-center gap-6 pt-2">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" name="is_featured" {% if service.is_featured or not service %}checked{% endif %}
                 class="w-4 h-4 rounded text-gold-primary focus:ring-gold-primary bg-midnight border-slate-700">
          <span class="text-xs text-slate-200 font-semibold">Feature on Home Page</span>
        </label>

        <div class="flex items-center gap-2">
          <label class="text-xs text-slate-400">Display Order:</label>
          <input type="number" name="order" value="{{ service.order|default:0 }}"
                 class="w-16 px-2 py-1 rounded bg-midnight border border-slate-700 text-xs text-slate-100 text-center">
        </div>
      </div>
    </div>

    <div class="pt-6 border-t border-gold-primary/20 flex items-center justify-between">
      <a href="{% url 'agency:services_admin_list' %}" class="px-5 py-2.5 rounded-xl bg-surface text-slate-400 hover:text-white text-xs">Cancel</a>
      <button type="submit" class="px-8 py-3 rounded-full bg-gradient-to-r from-gold-highlight via-gold-primary to-gold-bronze text-black font-bold text-xs shadow-xl hover:scale-105 transition-all">
        Save Service
      </button>
    </div>

  </form>

</div>

{% endblock %}
