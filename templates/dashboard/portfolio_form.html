{% extends 'dashboard/base_dashboard.html' %}
{% load static %}

{% block header_title %}{% if item %}Edit Case Study: {{ item.title }}{% else %}Add New Event Case Study{% endif %}{% endblock %}

{% block content %}

<div class="max-w-4xl space-y-6">
  
  <a href="{% url 'agency:portfolio_admin_list' %}" class="inline-flex items-center gap-1.5 text-xs text-slate-400 hover:text-gold-highlight transition-colors">
    <i data-lucide="arrow-left" class="w-4 h-4"></i>
    <span>Back to Portfolio List</span>
  </a>

  <form method="POST" class="glass-panel rounded-3xl p-6 sm:p-10 border border-gold-primary/30 shadow-2xl space-y-6">
    {% csrf_token %}

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
      <div class="sm:col-span-2">
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Event Title <span class="text-gold-primary">*</span></label>
        <input type="text" name="title" value="{{ item.title|default:'' }}" required placeholder="e.g. West Africa Tech Leadership Summit 2026"
               class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Category</label>
        <select name="category" class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">
          {% for code, label in categories %}
          <option value="{{ code }}" {% if item.category == code %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Date Held</label>
        <input type="date" name="date_held" value="{{ item.date_held|date:'Y-m-d'|default:'' }}"
               class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Client / Organization Name <span class="text-gold-primary">*</span></label>
        <input type="text" name="client_name" value="{{ item.client_name|default:'' }}" required placeholder="e.g. AfriTech Innovations"
               class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Lead Event Planner (Optional)</label>
        <input type="text" name="planner_name" value="{{ item.planner_name|default:'' }}" placeholder="e.g. Zenith Horizon Events"
               class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Venue / Hall</label>
        <input type="text" name="location" value="{{ item.location|default:'' }}" placeholder="e.g. Eko Convention Centre"
               class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">City &amp; Country</label>
        <input type="text" name="city" value="{{ item.city|default:'Lagos, Nigeria' }}" placeholder="e.g. Lagos, Nigeria"
               class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Crew Deployed Count</label>
        <input type="number" name="crew_deployed" value="{{ item.crew_deployed|default:24 }}" min="1" max="200"
               class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm font-bold text-gold-highlight">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Services Provided Summary</label>
        <input type="text" name="services_provided" value="{{ item.services_provided|default:'' }}" placeholder="e.g. VIP Protocol • QR Check-In • Stage Escort"
               class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">
      </div>

      <div class="sm:col-span-2">
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">High-Res Image URL <span class="text-gold-primary">*</span></label>
        <input type="url" name="image_url" value="{{ item.image_url|default:'' }}" required placeholder="https://images.unsplash.com/..."
               class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm font-mono">
      </div>

      <div class="sm:col-span-2">
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Key Highlight / Quantifiable Result <span class="text-gold-primary">*</span></label>
        <input type="text" name="highlight_result" value="{{ item.highlight_result|default:'' }}" required placeholder="e.g. 2,800+ delegates accredited in under 40 minutes with zero bottleneck."
               class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">
      </div>

      <div class="sm:col-span-2">
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Detailed Case Study Summary <span class="text-gold-primary">*</span></label>
        <textarea name="summary" rows="4" required placeholder="Describe the challenges, execution, and client feedback..."
                  class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">{{ item.summary|default:'' }}</textarea>
      </div>

      <div class="flex items-center gap-6 pt-2">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" name="is_featured" {% if item.is_featured or not item %}checked{% endif %}
                 class="w-4 h-4 rounded text-gold-primary focus:ring-gold-primary bg-midnight border-slate-700">
          <span class="text-xs text-slate-200 font-semibold">Feature on Home Page Carousel</span>
        </label>
      </div>
    </div>

    <div class="pt-6 border-t border-gold-primary/20 flex items-center justify-between">
      <a href="{% url 'agency:portfolio_admin_list' %}" class="px-5 py-2.5 rounded-xl bg-surface text-slate-400 hover:text-white text-xs">Cancel</a>
      <button type="submit" class="px-8 py-3 rounded-full bg-gradient-to-r from-gold-highlight via-gold-primary to-gold-bronze text-black font-bold text-xs shadow-xl hover:scale-105 transition-all">
        Save Case Study
      </button>
    </div>

  </form>

</div>

{% endblock %}
