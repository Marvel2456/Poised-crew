{% extends 'dashboard/base_dashboard.html' %}
{% load static %}

{% block header_title %}{% if uniform %}Edit Uniform Style: {{ uniform.name }}{% else %}Add New Uniform Style{% endif %}{% endblock %}

{% block content %}

<div class="max-w-3xl space-y-6">
  
  <a href="{% url 'agency:gallery_admin_list' %}" class="inline-flex items-center gap-1.5 text-xs text-slate-400 hover:text-gold-highlight transition-colors">
    <i data-lucide="arrow-left" class="w-4 h-4"></i>
    <span>Back to Lookbook</span>
  </a>

  <form method="POST" class="glass-panel rounded-3xl p-6 sm:p-8 border border-gold-primary/30 shadow-2xl space-y-5">
    {% csrf_token %}

    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Uniform Collection Name <span class="text-gold-primary">*</span></label>
      <input type="text" name="name" value="{{ uniform.name|default:'' }}" required placeholder="e.g. Imperial Black-Tie Tuxedo & Evening Gowns"
             class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Tag / Event Match</label>
        <input type="text" name="tag" value="{{ uniform.tag|default:'' }}" placeholder="e.g. VIP Galas & Red Carpets"
               class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Gender / Cut</label>
        <input type="text" name="gender" value="{{ uniform.gender|default:'Male & Female Matching' }}"
               class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">
      </div>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Color Palette &amp; Fabrics</label>
      <input type="text" name="color_palette" value="{{ uniform.color_palette|default:'Obsidian Black & Imperial Gold Silk' }}"
             class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">High-Res Image URL <span class="text-gold-primary">*</span></label>
      <input type="url" name="image_url" value="{{ uniform.image_url|default:'' }}" required placeholder="https://images.unsplash.com/..."
             class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm font-mono">
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Description &amp; Styling Guide <span class="text-gold-primary">*</span></label>
      <textarea name="description" rows="3" required placeholder="Describe the tailoring, lapels, buttons, and accessories..."
                class="w-full px-4 py-3 rounded-xl bg-midnight border border-slate-700 focus:border-gold-primary text-slate-100 text-sm">{{ uniform.description|default:'' }}</textarea>
    </div>

    <div class="pt-4 border-t border-gold-primary/20 flex items-center justify-between">
      <a href="{% url 'agency:gallery_admin_list' %}" class="px-5 py-2.5 rounded-xl bg-surface text-slate-400 hover:text-white text-xs">Cancel</a>
      <button type="submit" class="px-8 py-3 rounded-full bg-gradient-to-r from-gold-highlight via-gold-primary to-gold-bronze text-black font-bold text-xs shadow-xl hover:scale-105 transition-all">
        Save Uniform Style
      </button>
    </div>

  </form>

</div>

{% endblock %}
